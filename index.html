<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 11th Anniversary My Love 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%); 
            min-height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Lock Screen Page */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 243, 0.95);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lock-card {
            background: white;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 105, 135, 0.2);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 3px solid #fff0f5;
        }

        .lock-card h2 { font-family: 'Mitr', sans-serif; color: #ff5277; font-size: 1.6rem; margin-bottom: 8px; }
        .lock-card p { font-size: 0.9rem; color: #888; margin-bottom: 20px; }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffccd5;
            border-radius: 20px;
            text-align: center;
            font-size: 1.2rem;
            outline: none;
            transition: 0.3s;
            background: #fff9fa;
            letter-spacing: 2px;
        }

        input:focus { border-color: #ff5277; box-shadow: 0 0 10px rgba(255, 82, 119, 0.2); }

        .btn-unlock {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.3);
            transition: 0.3s;
        }

        .btn-unlock:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(255, 117, 140, 0.4); }

        /* Main Surprise Container */
        #main-content {
            display: none;
            width: 100%;
            max-width: 400px; /* ปรับความกว้างให้เหมาะกับวิดีโอแนวตั้ง */
            padding: 20px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header-title {
            font-family: 'Mitr', sans-serif;
            color: white;
            text-shadow: 0 3px 10px rgba(255, 71, 87, 0.3);
            margin-bottom: 15px;
        }

        /* Video Player Frame Container (สำหรับ Shorts แนวตั้ง 9:16) */
        .video-box {
            background: white;
            padding: 8px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            border: 4px solid #fff;
            position: relative;
            padding-bottom: 177.77%; /* อัตราส่วน 9:16 สำหรับแนวตั้ง */
            height: 0;
            overflow: hidden;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 18px;
        }

        /* Heart Animation */
        .heart {
            position: fixed;
            font-size: 20px;
            animation: float 4s linear infinite;
            bottom: -20px;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 🔒 หน้าปลดล็อก -->
    <div id="lock-screen">
        <div class="lock-card">
            <div style="font-size: 3rem; margin-bottom: 10px;">💌</div>
            <h2>Our Secret Code</h2>
            <p>กรอกวันครบรอบของเราเพื่อปลดล็อกความทรงจำ ❤️</p>
            <input type="password" id="passcode" placeholder="••••">
            <button class="btn-unlock" onclick="unlock()">เปิดดูวิดีโอ 🎬</button>
            <p id="error" style="color: #ff4757; font-size: 0.85rem; margin-top: 12px; display: none;">รหัสไม่ถูกต้อง ลองใหม่อีกทีนะคนดี!</p>
        </div>
    </div>

    <!-- 💖 หน้าแสดงวิดีโอเมื่อใส่รหัสถูก -->
    <div id="main-content">
        <div class="header-title">
            <h1 style="font-size: 1.8rem;">Happy Anniversary! 🎉</h1>
            <p style="font-weight: 300;">ขอบคุณที่เข้ามาเป็นความสุขในทุกๆ วันนะ ❤️</p>
        </div>

        <!-- 🎥 กล่องฝังวิดีโอ YouTube Shorts -->
        <div class="video-box">
            <iframe 
                src="https://www.youtube.com/embed/QVzNrKOiMGc?autoplay=1&rel=0" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <p style="color: white; font-size: 0.95rem; text-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 10px;">
            ✨ ที่ผ่านมามีความสุขมากๆ เลยนะ อยู่ด้วยกันแบบนี้นานๆ เลยนะ ✨
        </p>
    </div>

    <script>
        // 🛠️ เปลี่ยนรหัสผ่านตรงนี้ได้เลยนะครับ (เช่น "1234")
        const SECRET_CODE = "2409";

        function unlock() {
            const input = document.getElementById('passcode').value;
            if (input === SECRET_CODE) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                createHearts();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = ['💖', '💕', '🌸', '✨'][Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>
